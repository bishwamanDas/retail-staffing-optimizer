# Fly.io configuration for RevInsight - Store Staffing Analyzer
#
# Deploy with:
#   fly launch --copy-config --no-deploy
#   fly deploy
#
# NOTE: the app name must be globally unique on Fly.io - rename "revinsight"
# if it is already taken.

app = "revinsight"
primary_region = "bom"

[build]
  builder = "paketobuildpacks/builder:base"

[build.args]
  PIP_VERSION = "24.0"
  PIP_NO_CACHE_DIR = "0"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  MPLBACKEND = "Agg"
  REVINSIGHT_SALARY = "3.0"
  REVINSIGHT_COMMISSION = "0.05"
  REVINSIGHT_COGS = "0.50"
  REVINSIGHT_FORECAST_MONTHS = "6"
  REVINSIGHT_SEED = "42"
  REVINSIGHT_CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  soft_limit = 40
  hard_limit = 60

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
